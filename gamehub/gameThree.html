<style>
    /* 전체 판 (파란 테두리) */
    #field3 {
        width: 600px;
        height: 400px;
        margin: 0 auto;
        border: 1px solid #5b9bd5;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 18px;
    }

    /* 컴 숫자 / 유저 숫자 상자 공통 */
    .num3 {
        width: 150px;
        height: 140px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
        border: 1px solid #1f3864;
        color: white;
        font-weight: bold;
        font-size: 24px;
    }

    #comBox { background: #4472c4; }    /* 컴퓨터 숫자 */
    #userBox { background: gold; }      /* 유저 숫자 (맞으면 파랑, 틀리면 빨강으로 바뀜) */
</style>

<p id="info">시작 버튼을 눌러 주세요</p>
<button id="startBtn">게임 시작</button>
<button onclick="loadDoc3()">다시 시작</button>

<div id="field3">
    <div id="comBox" class="num3">컴 숫자</div>
    <div id="userBox" class="num3">유저 숫자</div>
</div>

<h3>상위 5개 기록</h3>
<ol id="ranking"></ol>

<script>
    (function () {
        const info = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const comBox = document.getElementById('comBox');
        const userBox = document.getElementById('userBox');

        // ===== 설정값: 여기 숫자만 바꿔서 난이도 조절 =====
        const startShow = 2000;   // 처음에 숫자가 떠 있는 시간(ms)
        const speedStep = 60;     // 하나 맞힐 때마다 줄어드는 시간(ms)
        const minShow = 400;      // 이보다 더 빨라지지는 않음
        const gap = 300;          // 숫자가 사라지고 다음 숫자가 뜰 때까지 쉬는 시간(ms)

        // 색
        const comColor = "#4472c4";
        const userColor = "gold";
        const rightColor = "royalblue";   // 맞았을 때
        const wrongColor = "crimson";     // 틀렸을 때

        let running = false;      // 게임이 진행 중인지
        let startTime = 0;
        let current = null;       // 컴퓨터가 지금 보여주는 숫자 (쉬는 중이면 null)
        let deadline = 0;         // 이 시각까지 입력해야 함
        let nextAt = 0;           // 다음 숫자가 뜰 시각
        let showTime = startShow; // 지금 숫자가 떠 있는 시간
        let score = 0;            // 맞힌 개수

        // 상자의 글자, 색, 글자 크기를 한 번에 바꾸는 함수
        function setBox(box, text, color, big) {
            box.innerText = text;
            box.style.background = color;
            if (big) {
                box.style.fontSize = "64px";
            } else {
                box.style.fontSize = "24px";
            }
        }

        // 저장된 기록을 불러오기 (없으면 빈 배열)
        function loadRecords() {
            const saved = localStorage.getItem('records3');
            if (saved == null) {
                return [];
            }
            return JSON.parse(saved);
        }

        // 순위를 화면에 표시
        function showRanking() {
            const records = loadRecords();
            let html = "";
            for (let i = 0; i < records.length; i++) {
                html = html + "<li>" + records[i].toFixed(1) + "초</li>";
            }
            document.getElementById('ranking').innerHTML = html;
        }

        function finish() {
            running = false;
            clearInterval(timer);   // 메인 페이지의 timer 를 씀

            const elapsed = (Date.now() - startTime) / 1000;   // 버틴 시간(초)
            info.innerText = "게임 종료! " + elapsed.toFixed(1) + "초 버텼어요 (맞힌 개수: " + score + ")";

            // 이번 기록을 넣고, 오래 버틴 순서로 정렬해서 상위 5개만 저장
            const records = loadRecords();
            records.push(elapsed);
            records.sort(function (a, b) { return b - a; });
            const top5 = records.slice(0, 5);
            localStorage.setItem('records3', JSON.stringify(top5));

            showRanking();
        }

        // 컴퓨터가 새 숫자를 보여줌
        function showNumber(now) {
            current = Math.floor(Math.random() * 10);   // 0~9 중 랜덤
            setBox(comBox, current, comColor, true);
            setBox(userBox, "?", userColor, true);       // 유저 칸은 처음 색으로 되돌림
            deadline = now + showTime;                   // 이 시각까지 못 누르면 틀린 걸로 침
        }

        // 0.02초(20ms)마다 계속 실행되는 함수
        function update() {
            const now = Date.now();
            info.innerText = "버틴 시간: " + ((now - startTime) / 1000).toFixed(1) + "초 / 맞힌 개수: " + score;

            if (current == null) {
                // 쉬는 중: 때가 되면 다음 숫자
                if (now >= nextAt) {
                    showNumber(now);
                }
            } else if (now >= deadline) {
                // 숫자가 사라질 때까지 못 눌렀으면 게임 종료
                setBox(userBox, "시간 초과", wrongColor, false);
                finish();
            }
        }

        // 키를 눌렀을 때
        function onKey(e) {
            // 이 게임 화면이 사라졌으면(다른 게임으로 바꿨으면) 이 키 감지기도 스스로 제거
            if (!document.body.contains(userBox)) {
                document.removeEventListener('keydown', onKey);
                return;
            }

            if (!running || current == null) { return; }          // 숫자가 떠 있을 때만 입력 받음
            if ("0123456789".indexOf(e.key) == -1) { return; }    // 숫자 키만 (윗줄 숫자, 키패드 모두 같은 값)

            if (e.key == String(current)) {
                // 맞음: 유저 칸이 파란색
                setBox(userBox, e.key, rightColor, true);
                score = score + 1;
                current = null;
                setBox(comBox, "", comColor, true);   // 컴퓨터 칸을 잠깐 비움 (같은 숫자가 연속으로 나와도 구분되게)

                showTime = Math.max(minShow, showTime - speedStep);   // 더 빨라짐
                nextAt = Date.now() + gap;
            } else {
                // 틀림: 유저 칸이 빨간색, 게임 종료
                setBox(userBox, e.key, wrongColor, true);
                finish();
            }
        }

        function startGame() {
            startTime = Date.now();
            nextAt = startTime + 700;   // 시작하고 0.7초 뒤에 첫 숫자
            running = true;
            startBtn.disabled = true;   // 중복 클릭 방지
            timer = setInterval(update, 20);
        }

        startBtn.addEventListener('click', startGame);
        document.addEventListener('keydown', onKey);
        showRanking();
    })();
</script>
