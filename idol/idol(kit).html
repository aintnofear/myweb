<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="idol(kit).css">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        h2{
            margin: 40px 0 0 30px;
        }
        ul{
            margin: 30px;
            width: 430px;
            border: solid 1px #dddddd;
        }
        li{
            list-style-type: none;
            padding: 5px 20px;
        }
        .row1 img{
            width: 400px;
        }
        .row2{
            border-top: solid 1px #dddddd;
            font-weight: bold;
            font-size: 18px;
            padding-top: 20px;
        }
        .row3{
            font-weight: bold;
        }
        .row4{
            margin-top: 10px;
            line-height: 150%;
        }
        .row5{
            margin-top: 10px;
            margin-bottom: 10px;
            line-height: 150%;
        }
        .row6 span{
            color: orange;
        }
    </style>
</head>
<body>
    <h2>팬클럽 키트 1기</h2>
    <ul>
        <li class="row1"><img src="images/kit.png"></li>
        <li class="row1"><img src="images/productinfo.png"></li>
        <li class="row2">Jung SeongHo OFFICIAL FANCLUB</li>
        <li class="row3">35,000원</li>
        <li class="row4">본 FANCLUB KIT는 구매하신 순서대로 10월 중 순차 배송 예정입니다.</li>
        <li class="row5">모니터 사양에 따라 제품의 색상이 달라 보일 수 있으니 참고해 주세요.</li>
        <li class="row6">리뷰 <span>130</span> 평점 <span>4.9/5</span></li>
    </ul>
</body>
</html>
