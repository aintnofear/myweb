<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로젝트 아카이브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&display=swap">
<style>
  /* 레이아웃: 좁은 한 단, 위에 제목, 아래로 프로젝트가 한 줄씩 쌓이는 목록 */
  :root {
    --bg: #f7f9fb;          /* 아주 밝은 회색 바탕 */
    --paper: #ffffff;       /* 목록 종이 */
    --line: #e2e8ee;        /* 구분선 */
    --ink: #24303b;         /* 본문 글자 */
    --muted: #7a8794;       /* 보조 글자 */
    --sky: #4a9fd8;         /* 하늘색 포인트 */
    --sky-soft: #eaf4fb;    /* 마우스 올렸을 때 연한 하늘색 */
    --font-display: "Nanum Myeongjo", "Batang", "바탕", serif;
    --font-body: "Gowun Batang", "Nanum Myeongjo", "Batang", "바탕", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171c; --paper: #182028; --line: #2a3540; --ink: #e6edf3;
      --muted: #8d9aa7; --sky: #7cc0ef; --sky-soft: #1d2c39; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12171c; --paper: #182028; --line: #2a3540; --ink: #e6edf3;
    --muted: #8d9aa7; --sky: #7cc0ef; --sky-soft: #1d2c39; color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.7;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding-block: 72px 96px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  /* 머리말 */
  header { display: flex; flex-direction: column; gap: 12px; }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--sky);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 2.8rem);
    line-height: 1.3;
    text-wrap: balance;
  }
  .intro { margin: 0; color: var(--muted); max-width: 34em; }
  .count {
    font-size: 14px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }

  /* 프로젝트 목록 */
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
  }
  .list li + li { border-top: 1px solid var(--line); }

  .item {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 16px;
    padding: 26px 28px;
    color: inherit;
    text-decoration: none;
    transition: background-color .3s ease;
  }
  /* 왼쪽에서 자라나는 하늘색 선 */
  .item::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--sky);
    transform: scaleY(0);
    transform-origin: center;
    transition: transform .35s ease;
  }
  .text { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .name {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.35rem;
    transition: transform .35s ease, color .3s ease;
  }
  .name .prefix {
    color: var(--sky);
    font-weight: 400;
    font-size: .8em;
    letter-spacing: .04em;
  }
  .desc {
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    transition: transform .35s ease;
  }
  .meta {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--muted);
    font-size: 13px;
  }
  .tag {
    padding: 2px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap;
  }
  .arrow {
    width: 36px; height: 36px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--sky);
    transition: transform .35s ease, background-color .3s ease, color .3s ease, border-color .3s ease;
  }

  /* 마우스를 올렸을 때 반응 */
  .item:hover, .item:focus-visible { background: var(--sky-soft); outline: none; }
  .item:hover::before, .item:focus-visible::before { transform: scaleY(1); }
  .item:hover .name, .item:focus-visible .name { transform: translateX(8px); }
  .item:hover .desc, .item:focus-visible .desc { transform: translateX(8px); }
  .item:hover .arrow, .item:focus-visible .arrow {
    background: var(--sky);
    border-color: var(--sky);
    color: var(--paper);
    transform: translateX(4px) rotate(-45deg);
  }
  .item:focus-visible { box-shadow: inset 0 0 0 2px var(--sky); }

  /* 링크가 아직 없는 항목 */
  .item.pending { cursor: default; }
  .item.pending .arrow { border-style: dashed; color: var(--muted); }
  .item.pending:hover .arrow { background: transparent; color: var(--muted); border-color: var(--muted); transform: none; }

  footer { color: var(--muted); font-size: 13px; text-align: right; }

  @media (max-width: 520px) {
    .wrap { padding-block: 48px 64px; }
    .item { padding: 22px 18px; }
    .meta .tag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">PROJECT ARCHIVE</span>
    <h1>지금까지 만든 것들</h1>
    <p class="intro">하나씩 직접 만들어 본 프로젝트를 모아 두었습니다. 항목을 누르면 해당 프로젝트로 이동합니다.</p>
    <div class="count" id="count"></div>
  </header>

  <ul class="list" id="list"></ul>

  <footer>2026 · 계속 추가하는 중</footer>
</div>

<script>
  // ▼ 프로젝트를 추가하거나 링크를 넣을 땐 여기만 고치면 됩니다
  //   link 에 주소를 넣으면 눌러서 이동할 수 있게 바뀌어요
  const projects = [
    { name: "메세지 카드 전하기", desc: "안녕이라는 말은 하지 말아요 · 종말 10분 전, 빈 문장을 채워 마음을 전하는 편지", tag: "웹 페이지", link: "letter/index.html" },   // ★ 수정: 깃허브용 폴더 주소
    { name: "게임허브",           desc: "AJAX로 피하기·상자 잡기·숫자 맞히기 미니게임을 불러오는 허브", tag: "게임", link: "gamehub/index.html" },   // ★ 수정: 깃허브용 폴더 주소
    { name: "틱택토",             desc: "하늘색(나)과 토마토색(컴퓨터)으로 칸을 칠해 한 줄을 먼저 만드는 3×3 게임", tag: "게임", link: "tictactoe/index.html" },   // ★ 수정: 깃허브용 폴더 주소
    { name: "가위바위보",         desc: "손 그림 이미지로 컴퓨터와 한 판씩 겨루는 게임",      tag: "게임",     link: "rps/index.html" },   // ★ 수정: 깃허브용 폴더 주소
    { name: "아이돌 육성",        desc: "가상의 아이돌 팬클럽 사이트 — 메인, 새소식, 팬클럽 키트, 기획 화면", tag: "웹 페이지", link: "idol/index.html" },   // ★ 수정: 깃허브용 폴더 주소
  ];

  const list = document.getElementById("list");

  projects.forEach(p => {
    const li = document.createElement("li");
    const hasLink = p.link.trim() !== "";
    const el = document.createElement(hasLink ? "a" : "div");
    el.className = "item" + (hasLink ? "" : " pending");
    if (hasLink) {
      el.href = p.link;
    } else {
      el.tabIndex = 0;
      el.title = "링크 준비 중";
    }
    el.innerHTML = `
      <div class="text">
        <h2 class="name"><span class="prefix">프로젝트:</span>${p.name}</h2>
        <p class="desc">${p.desc}</p>
      </div>
      <div class="meta">
        <span class="tag">${hasLink ? p.tag : "링크 준비 중"}</span>
        <span class="arrow" aria-hidden="true">→</span>
      </div>`;
    li.appendChild(el);
    list.appendChild(li);
  });

  document.getElementById("count").textContent = `총 ${projects.length}개의 프로젝트`;
</script>

</body>
</html>
