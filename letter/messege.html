<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Batang&display=swap" rel="stylesheet">
    <style>
        #east-sea-dokdo-regular + label{
            font-family: "East Sea Dokdo", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: #dddddd;
            font-size: 1.5rem;
        }
        #gowun-batang-regular + label{
            font-family: "Gowun Batang", serif;
            font-weight: 400;
            font-style: normal;
            color: tomato;
            font-size: 1.5em;
        }
        .d1:has(#east-sea-dokdo-regular:checked) ~ .d2 #msg{
            font-family: "East Sea Dokdo", serif;
            font-weight: 400;
            font-style: normal;
            color: skyblue;
            font-size: 1.5em;
        }
        .d1:has(#gowun-batang-regular:checked) ~ .d2 #msg{
            font-family: "Gowun Batang", serif;
            font-weight: 400;
            font-style: normal;
            color: #ddd;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="d1">
        <input type="radio" name="font" id="east-sea-dokdo-regular">
        <label for="east-sea-dokdo-regular">East Sea 폰트</label>
        <input type="radio" name="font" id="gowun-batang-regular">
        <label for="gowun-batang-regular">고운 바탕 폰트</label>
    </div>
    <div class="d2">
        <textarea rows="5" cols="80" id="msg"></textarea>
    </div>
</body>
</html>
